<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Prompt Builder</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --text-main: #1f2937;
            --text-sub: #4b5563;
            --border: #e5e7eb;
            --accent-green: #059669;
            --accent-orange: #d97706;
        }
        body { font-family: system-ui, -apple-system, sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; background: var(--bg-color); color: var(--text-main); }
        h1 { font-size: 1.4rem; color: var(--primary); margin-bottom: 5px; }
        p.subtitle { color: var(--text-sub); font-size: 0.9rem; margin-top: 0; margin-bottom: 20px; }

        .layout { display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .layout { grid-template-columns: 1fr; } }

        .panel { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h2 { font-size: 1.1rem; margin-top: 0; color: var(--text-main); border-bottom: 2px solid var(--border); padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }

        /* 設定バー（AIモデル切替など） */
        .settings-bar { display: flex; gap: 15px; margin-bottom: 15px; background: #eef2ff; padding: 10px 14px; border-radius: 8px; border: 1px solid #c7d2fe; align-items: center; }
        .settings-bar label { font-size: 0.85rem; font-weight: 500; color: var(--primary); }
        .settings-bar select { padding: 4px 8px; font-size: 0.85rem; border-radius: 4px; border: 1px solid var(--border); background: white; }

        /* カラー選択セクションのスタイル */
        .color-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .color-group { display: flex; flex-direction: column; gap: 4px; }
        .color-group label { font-size: 0.8rem; font-weight: 500; color: var(--text-sub); }
        .color-group select { padding: 6px 8px; font-size: 0.85rem; border: 1px solid var(--border); border-radius: 6px; outline: none; background: white; cursor: pointer; }
        .color-group select:focus { border-color: var(--primary); }

        .search-box { margin-bottom: 12px; }
        .search-box input { width: 100%; padding: 10px 14px; font-size: 0.95rem; border: 2px solid var(--border); border-radius: 8px; box-sizing: border-box; outline: none; transition: border-color 0.2s; }
        .search-box input:focus { border-color: var(--primary); }

        .custom-input-box { display: flex; gap: 8px; margin-bottom: 15px; }
        .custom-input-box input { flex: 1; padding: 8px 12px; font-size: 0.9rem; border: 1px solid var(--border); border-radius: 6px; outline: none; }

        /* 縦一列リストのスタイル */
        .tag-pool { display: flex; flex-direction: column; gap: 6px; max-height: 380px; overflow-y: auto; padding: 4px; }
        .tag-row { display: flex; align-items: center; justify-content: space-between; background: #f9fafb; border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; cursor: pointer; transition: all 0.15s; user-select: none; }
        .tag-row:hover { background: #e0e7ff; border-color: var(--primary); }
        .tag-row.selected { background: #eef2ff; border-color: var(--primary); box-shadow: inset 3px 0 0 var(--primary); }

        .tag-info { display: flex; flex-direction: column; gap: 2px; }
        .tag-jp { font-size: 0.9rem; font-weight: 500; color: var(--text-main); }
        .tag-en { font-size: 0.8rem; font-family: monospace; color: var(--primary); }
        .tag-badge { font-size: 0.75rem; background: #e5e7eb; color: var(--text-sub); padding: 2px 6px; border-radius: 4px; align-self: flex-start; }

        .selected-list-area { display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow-y: auto; padding: 6px; background: #f9fafb; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 15px; }
        .selected-item { display: flex; align-items: center; justify-content: space-between; background: white; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border); font-size: 0.85rem; gap: 10px; }
        .selected-item .tag-name { font-weight: 500; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .selected-item .weight-controls { display: flex; align-items: center; gap: 6px; }
        .selected-item input[type="range"] { width: 70px; cursor: pointer; }
        .selected-item .weight-val { font-family: monospace; font-size: 0.8rem; width: 30px; text-align: right; color: var(--primary); }

        /* プリセット保存エリア */
        .preset-area { display: flex; gap: 8px; margin-bottom: 12px; }
        .preset-area input { flex: 1; padding: 6px 10px; font-size: 0.85rem; border: 1px solid var(--border); border-radius: 6px; }
        .preset-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 15px; max-height: 100px; overflow-y: auto; }
        .preset-chip { background: #f3f4f6; border: 1px solid var(--border); padding: 4px 10px; border-radius: 16px; font-size: 0.8rem; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
        .preset-chip:hover { background: #e5e7eb; }
        .preset-del { color: #ef4444; font-weight: bold; font-size: 0.75rem; }

        textarea { width: 100%; height: 100px; padding: 10px; font-size: 0.9rem; border: 1px solid var(--border); border-radius: 8px; box-sizing: border-box; background: #fafafa; resize: vertical; margin-bottom: 8px; font-family: monospace; }
        .btn { background: var(--primary); color: white; border: none; padding: 8px 16px; font-size: 0.9rem; border-radius: 6px; cursor: pointer; transition: background 0.15s; }
        .btn:hover { background: var(--primary-hover); }
        .btn-green { background: var(--accent-green); }
        .btn-orange { background: var(--accent-orange); }
    </style>
</head>

            </select>
        </div>
    </div>

                        </select>
                    </div>
                    <div class="color-group">
                        <label>目の色 (Eye Color)</label>
                        <select id="eyeColorSelect" onchange="updateColors()">

                    <div class="color-group">

                            <option value="matching eyebrows">髪色に合わせた眉</option>

                        </select>
                    </div>
                    <div class="color-group">
                        <label>服装の色 (Outfit Color)</label>

                            <option value="">指定なし</option>
                            <option value="black clothes">黒基調</option>
                            <option value="white clothes">白基調</option>
                            <option value="blue clothes">青基調</option>
                            <option value="red clothes">赤基調</option>
                            <option value="pastel colors">パステルカラー</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="panel" style="padding: 15px 20px;">
                <h2 style="border:none; margin-bottom: 8px;">➕ 任意のプロンプト追加</h2>
                <div class="custom-input-box" style="margin-bottom:0;">
                    <input type="text" id="customInput" placeholder="例: masterpiece, 1girl..." onkeypress="handleCustomKey(event)">
                    <button class="btn btn-green" onclick="addCustomPrompt()">追加</button>
                </div>
            </div>

            <div class="panel">
                <h2>
                    <span>タグデータベース</span>
                    <span style="font-size:0.8rem; font-weight:normal; color:var(--text-sub);">クリックで選択</span>
                </h2>

                <div class="search-box" style="margin-top: 10px;">
                    <input type="text" id="searchInput" placeholder="🔍 タグを検索（日本語・英語対応）" oninput="filterTags()">
                </div>

                <div class="tag-pool" id="tagPool"></div>
            </div>
        </div>

        <!-- 右側：選択中タグ & プリセット保存 & 出力 -->
        <div>
            <div class="panel">
                <h2>選択中のタグ & ウェイト調整</h2>
                <div class="selected-list-area" id="selectedListArea">

                </div>

                <!-- マイプリセット保存機能 -->

                    <input type="text" id="presetNameInput" placeholder="プリセット名（例: お気に入り自室カフェ風）">

                </div>
                <div class="preset-list" id="presetListArea">

                <textarea id="outputPositive" readonly placeholder="ここにウェイト反映済みで生成されます"></textarea>

                <h3 style="margin-top: 15px;">ネガティブプロンプト</h3>
                <textarea id="outputNegative" style="height: 50px;" readonly>nsfw, lowres, bad anatomy, bad hands, text, error, missing fingers, extra digit, fewer digits, cropped, worst quality, low quality, normal quality, jpeg artifacts, signature, watermark, username, blurry</textarea>
                <button class="btn" onclick="copyToClipboard('outputNegative')" style="background: #4b5563;">ネガティブをコピー</button>
            </div>
        </div>
    </div>

        let selectedList = [];

        // 起動時に保存されたプリセットを読み込む
        window.onload = function() {
            renderTagPool(masterTags);
            renderPresetList();
        };

        function updateColors() {
            selectedList = selectedList.filter(item => item.tag.cat !== 'color');
            const hair = document.getElementById('hairColorSelect').value;
            const eye = document.getElementById('eyeColorSelect').value;
            const brow = document.getElementById('browColorSelect').value;
            const outfit = document.getElementById('outfitColorSelect').value;

            if (hair) selectedList.unshift({ tag: { jp: "髪色: " + hair, en: hair, cat: "color" }, weight: 1.0 });
            if (eye) selectedList.unshift({ tag: { jp: "瞳色: " + eye, en: eye, cat: "color" }, weight: 1.0 });
            if (brow) selectedList.unshift({ tag: { jp: "眉: " + brow, en: brow, cat: "color" }, weight: 1.0 });
            if (outfit) selectedList.unshift({ tag: { jp: "服装色: " + outfit, en: outfit, cat: "color" }, weight: 1.0 });

            renderSelectedArea();
        }

        function renderTagPool(tagsToDisplay) {
            const pool = document.getElementById('tagPool');
            pool.innerHTML = '';

            tagsToDisplay.forEach((tag) => {
                const isSelected = selectedList.some(item => item.tag.en === tag.en);
                const row = document.createElement('div');
                row.className = `tag-row ${isSelected ? 'selected' : ''}`;

                row.innerHTML = `
                    <div class="tag-info">
                        <span class="tag-jp">${tag.jp}</span>
                        <span class="tag-en">${tag.en}</span>
                    </div>
                    <span class="tag-badge">${tag.cat}</span>
                `;
                row.onclick = () => toggleTag(tag);
                pool.appendChild(row);
            });
        }

        function toggleTag(tag) {
            const index = selectedList.findIndex(item => item.tag.en === tag.en);
            if (index > -1) {
                selectedList.splice(index, 1);
            } else {
                selectedList.push({ tag: tag, weight: 1.0 });
            }
            renderTagPool(masterTags);
            renderSelectedArea();
        }

        function addCustomPrompt() {
            const input = document.getElementById('customInput');
            const val = input.value.trim();
            if (!val) return;

            const parts = val.split(',').map(s => s.trim()).filter(s => s.length > 0);
            parts.forEach(part => {
                let existing = masterTags.find(t => t.en.toLowerCase() === part.toLowerCase());
                if (!existing) {
                    existing = { jp: part, en: part, cat: "custom" };
                    masterTags.unshift(existing);
                }
                if (!selectedList.some(item => item.tag.en === existing.en)) {
                    selectedList.push({ tag: existing, weight: 1.0 });
                }
            });

            input.value = '';
            filterTags();
            renderSelectedArea();
        }

        function handleCustomKey(event) {
            if (event.key === 'Enter') addCustomPrompt();
        }

        function updateWeight(index, newWeight) {
            selectedList[index].weight = parseFloat(newWeight);
            const valSpan = document.getElementById(`weight-val-${index}`);
            if (valSpan) valSpan.textContent = parseFloat(newWeight).toFixed(1);
            updateOutputText();
        }

        function removeSelectedItem(index) {
            selectedList.splice(index, 1);
            renderTagPool(masterTags);
            renderSelectedArea();
        }

        function renderSelectedArea() {
            const area = document.getElementById('selectedListArea');

            if (selectedList.length === 0) {
                area.innerHTML = '<span style="color: #9ca3af; font-size: 0.85rem; padding: 10px;">左側からタグを選んでね</span>';
                updateOutputText();
                return;
            }

            area.innerHTML = '';
            selectedList.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = 'selected-item';

                const displayName = item.tag.cat === 'custom' || item.tag.cat === 'color' ? item.tag.en : `${item.tag.jp} (${item.tag.en})`;

                row.innerHTML = `
                    <div class="tag-name" title="${displayName}">${displayName}</div>
                    <div class="weight-controls">
                        <span style="font-size:0.75rem; color:var(--text-sub);">強さ:</span>
                        <input type="range" min="0.1" max="2.0" step="0.1" value="${item.weight}" oninput="updateWeight(${index}, this.value)">
                        <span class="weight-val" id="weight-val-${index}">${item.weight.toFixed(1)}</span>
                        <button class="btn" style="padding: 2px 6px; font-size:0.75rem; background:#ef4444;" onclick="removeSelectedItem(${index})">✕</button>
                    </div>
                `;
                area.appendChild(row);
            });

            updateOutputText();
        }

        function updateOutputText() {
            const output = document.getElementById('outputPositive');
            const model = document.getElementById('aiModelSelect').value;

            if (selectedList.length === 0) {
                output.value = '';
                return;
            }

            const formattedTags = selectedList.map(item => {
                const w = item.weight;
                const tag = item.tag.en;

                if (model === 'sd') {
                    // Stable Diffusion形式: (tag:1.2) または tag
                    if (Math.abs(w - 1.0) < 0.01) {
                        return tag;
                    } else {
                        return `(${tag}:${w.toFixed(1)})`;
                    }
                } else {
                    // NovelAI形式: 1.0より高ければ {tag}, 低ければ [tag] など、または簡易的にブレース
                    if (w > 1.1) {
                        return `{${tag}}`;
                    } else if (w < 0.9) {
                        return `[${tag}]`;
                    } else {
                        return tag;
                    }
                }
            });

            output.value = formattedTags.join(', ');
        }

        // --- マイプリセット保存・管理（localStorage） ---
        function savePreset() {
            const nameInput = document.getElementById('presetNameInput');
            const name = nameInput.value.trim();
            if (!name) {
                alert('プリセット名を入力してください！');
                return;
            }
            if (selectedList.length === 0) {
                alert('保存するタグが選択されていません！');
                return;
            }

            let presets = JSON.parse(localStorage.getItem('my_prompt_presets') || '{}');
            presets[name] = selectedList;
            localStorage.setItem('my_prompt_presets', JSON.stringify(presets));

            nameInput.value = '';
            renderPresetList();
            alert(`「${name}」のプリセットを保存しました！`);
        }

        function renderPresetList() {
            const area = document.getElementById('presetListArea');
            let presets = JSON.parse(localStorage.getItem('my_prompt_presets') || '{}');
            const keys = Object.keys(presets);

            if (keys.length === 0) {
                area.innerHTML = '<span style="color: #9ca3af; font-size: 0.8rem;">保存されたプリセットはありません</span>';
                return;
            }

            area.innerHTML = '';
            keys.forEach(name => {
                const chip = document.createElement('div');
                chip.className = 'preset-chip';
                chip.innerHTML = `<span>📁 ${name}</span> <span class="preset-del" onclick="event.stopPropagation(); deletePreset('${name}')">✕</span>`;
                chip.onclick = () => loadPreset(name);
                area.appendChild(chip);
            });
        }

        function loadPreset(name) {
            let presets = JSON.parse(localStorage.getItem('my_prompt_presets') || '{}');
            if (presets[name]) {
                selectedList = presets[name];
                renderTagPool(masterTags);
                renderSelectedArea();
                alert(`「${name}」を呼び出しました！`);
            }
        }

        function deletePreset(name) {
            let presets = JSON.parse(localStorage.getItem('my_prompt_presets') || '{}');
            delete presets[name];
            localStorage.setItem('my_prompt_presets', JSON.stringify(presets));
            renderPresetList();
        }

        function filterTags() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const filtered = masterTags.filter(t =>
                t.jp.toLowerCase().includes(keyword) || t.en.toLowerCase().includes(keyword) || t.cat.toLowerCase().includes(keyword)
            );
            renderTagPool(filtered);
        }

        function copyToClipboard(elementId) {
            const textarea = document.getElementById(elementId);
            if (!textarea.value) return;
            textarea.select();
            document.execCommand('copy');
            alert('クリップボードにコピーしました！');
        }
